<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Another Litoral Classic</title>
<meta name="description" content="Another Litoral Classic — banderas, productos y video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- HEADER: banderas del litoral desfilando detrás del logo -->
<header class="header" id="inicio">
  <div class="flagstrip" aria-hidden="true">
    <div class="flagstrip__track" id="flagTrack"></div>
  </div>
  <div class="header__veil" aria-hidden="true"></div>

  <div class="header__brand">
    <img class="header__logo" id="headerLogo" src="" alt="">
  </div>
</header>

<main>

  <!-- VIDEO -->
  <section class="video" id="video">
    <div class="video__frame" id="videoFrame">
      <button class="video__play" id="videoPlay" type="button" aria-label="Reproducir video">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
      </button>
      <span class="video__label" id="videoLabel">Video clip de YouTube</span>
    </div>
  </section>

  <!-- PRODUCTOS -->
  <section class="shop" id="productos">
    <div class="grid" id="productGrid"></div>
  </section>

</main>

<!-- FOOTER: créditos -->
<footer class="footer" id="creditos">
  <p class="footer__brand" id="footBrand"></p>
  <nav class="footer__links" id="footLinks" aria-label="Redes"></nav>
  <p class="footer__dev" id="footDev"></p>
  <p class="footer__copy" id="footCopy"></p>
</footer>

<!-- QUICK VIEW: panel lateral con el detalle del producto -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <button class="drawer__close" id="drawerClose" type="button" aria-label="Cerrar">&times;</button>
  <div class="drawer__media" id="drawerMedia"></div>
  <div class="drawer__info">
    <h2 class="drawer__title" id="drawerTitle"></h2>
    <p class="drawer__price" id="drawerPrice"></p>
    <p class="drawer__desc" id="drawerDesc"></p>
    <a class="drawer__cta" id="drawerCta" href="#" target="_blank" rel="noopener">Consultar por WhatsApp</a>
  </div>
</aside>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
